<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AG Shop Pro — Customer History</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0a1628;--accent:#e94560;--gold:#c9a84c;--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#1a2035;--muted:#718096;--green:#2f855a;--blue:#2b6cb0;--yellow:#b7791f;--red:#c53030;--purple:#6b46c1}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:13px}
.topbar{background:var(--navy);padding:11px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.brand{font-family:'DM Serif Display',serif;font-size:.9rem;color:#fff}
.brand span{color:var(--accent)}
.btn{padding:6px 12px;border-radius:8px;font-size:.72rem;cursor:pointer;font-family:'DM Sans',sans-serif;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);transition:all .15s}
.btn:hover{background:rgba(255,255,255,.15)}
.btn-white{background:#fff;color:var(--navy);border-color:#fff}
.btn-r{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-sm{padding:4px 9px;font-size:.65rem}
.content{max-width:960px;margin:0 auto;padding:20px}
.customer-hero{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 24px;margin-bottom:18px}
.ch-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.ch-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:600;flex-shrink:0}
.ch-name{font-size:1.1rem;font-weight:600;margin-bottom:3px}
.ch-contact{font-size:.78rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.ch-source{font-size:.65rem;color:var(--accent);background:#fff5f5;padding:2px 7px;border-radius:50px;border:1px solid rgba(233,69,96,.2)}
.ch-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding-top:14px;border-top:1px solid var(--border)}
.ch-stat{text-align:center}
.ch-stat-val{font-size:1.2rem;font-weight:600;color:var(--text)}
.ch-stat-lbl{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.tab-bar{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{padding:8px 16px;font-size:.78rem;font-weight:500;cursor:pointer;border:none;background:none;color:var(--muted);font-family:'DM Sans',sans-serif;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}
.tab-content{display:none}
.tab-content.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px}
.card-hdr{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:.82rem;font-weight:600}
.vehicle-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.vc-top{padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer}
.vc-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:#f8fafc;flex-shrink:0}
.vc-vin{font-size:.65rem;font-family:monospace;color:var(--muted);margin-top:1px}
.vc-year{font-size:.9rem;font-weight:600}
.vc-make{font-size:.8rem;color:var(--text)}
.vc-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.badge{display:inline-flex;padding:2px 8px;border-radius:50px;font-size:.62rem;font-weight:600}
.b-green{background:#c6f6d5;color:#276749}
.b-blue{background:#bee3f8;color:#2a4365}
.b-yellow{background:#fefcbf;color:#744210}
.b-red{background:#fed7d7;color:#822727}
.b-gray{background:#edf2f7;color:#4a5568}
.b-purple{background:#e9d8fd;color:#553c9a}
.b-orange{background:#feebc8;color:#7b341e}
.mileage-timeline{padding:12px 16px;border-top:1px solid var(--border)}
.ml-title{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
.ml-track{display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:4px}
.ml-point{display:flex;flex-direction:column;align-items:center;min-width:70px}
.ml-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0}
.ml-line{height:2px;flex:1;background:var(--border);min-width:20px}
.ml-mileage{font-size:.7rem;font-weight:600;margin-top:4px;text-align:center}
.ml-date{font-size:.6rem;color:var(--muted);text-align:center}
.ro-timeline{display:flex;flex-direction:column;gap:0}
.ro-row{display:flex;align-items:flex-start;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.ro-row:last-child{border-bottom:none}
.ro-row:hover{background:#f8fafc}
.ro-row.expanded{background:#fafbff}
.ro-date-col{width:80px;flex-shrink:0;text-align:right}
.ro-date{font-size:.75rem;font-weight:500}
.ro-year{font-size:.65rem;color:var(--muted)}
.ro-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.ro-line{width:1px;background:var(--border);flex-shrink:0;align-self:stretch;margin:12px 0 0;min-height:20px}
.ro-body{flex:1}
.ro-title{font-size:.82rem;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:7px}
.ro-complaint{font-size:.72rem;color:var(--muted);margin-bottom:5px;line-height:1.5}
.ro-totals{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.ro-total-item{font-size:.68rem;color:var(--muted)}
.ro-total-item strong{color:var(--text)}
.ro-detail{display:none;margin-top:8px}
.ro-detail.open{display:block}
.lines-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lines-section{background:#f8fafc;border-radius:8px;overflow:hidden}
.lines-hdr{padding:6px 10px;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:#f1f5f9;border-bottom:1px solid var(--border)}
.line-item{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--border);font-size:.72rem}
.line-item:last-child{border-bottom:none}
.line-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.line-desc{flex:1;color:var(--text)}
.line-cat{font-size:.6rem;color:var(--muted)}
.line-amt{font-weight:500;white-space:nowrap}
.cat-chip{display:inline-flex;padding:1px 6px;border-radius:50px;font-size:.58rem;font-weight:600;margin-right:4px}
.payment-row{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:.78rem}
.payment-row:last-child{border-bottom:none}
.category-bar{height:8px;background:#edf2f7;border-radius:50px;overflow:hidden;margin-bottom:6px}
.category-fill{height:100%;border-radius:50px}
.search-bar{display:flex;gap:8px;margin-bottom:14px}
.search-input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:.78rem;font-family:'DM Sans',sans-serif;background:var(--card)}
.search-input:focus{outline:none;border-color:var(--accent)}
.toast{position:fixed;bottom:16px;right:16px;background:var(--navy);color:#fff;padding:9px 14px;border-radius:9px;font-size:.75rem;z-index:999;opacity:0;transform:translateY(6px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.source-pill{font-size:.62rem;padding:2px 7px;border-radius:50px;background:#ebf8ff;color:#2a4365;border:1px solid #bee3f8}
</style>
</head>
<body>
<script src="auth.js"></script>
<script src="api.js"></script>
<script>
(function(){
  if(!AUTH.requireRoles(['manager', 'service_advisor', 'super_admin'])) return;
})();
</script>

<div class="topbar">
  <div class="brand">AG <span>Shop Pro</span> <span style="font-size:.72rem;color:rgba(255,255,255,.35);font-family:'DM Sans',sans-serif">/ Customer history</span></div>
  <div style="display:flex;gap:7px;align-items:center">
    <span id="topbar-user" style="font-size:.68rem;color:rgba(255,255,255,.45)"></span>
    <button class="btn btn-sm" onclick="history.back()">← Back</button>
    <button class="btn btn-sm btn-white" onclick="window.print()">Print report</button>
    <button class="btn btn-sm btn-r" id="signout-btn">Sign out</button>
  </div>
</div>

<div class="content" id="content"></div>

<script>
/* ============================================================
   Customer history — all content below is rendered from
   /api/customers/:id/history (API.customerHistory) and
   /api/customers (API.customers). There is no local sample data.
   ============================================================ */

const esc = (v) => API.escape(v);
const content = document.getElementById('content');

/* ── Session header ── */
(function initHeader(){
  const s = AUTH.getSession();
  const el = document.getElementById('topbar-user');
  if (s && el) {
    el.textContent = [s.name, s.activeWorkspaceName].filter(Boolean).join(' · ');
  }
  document.getElementById('signout-btn').addEventListener('click', () => AUTH.logout());
})();

/* ── Small formatters ── */

function validDate(v) {
  if (!v) return null;
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? null : d;
}
function monthDay(v) {
  const d = validDate(v);
  return d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—';
}
function yearOf(v) {
  const d = validDate(v);
  return d ? String(d.getFullYear()) : '';
}
function monthYear(v) {
  const d = validDate(v);
  return d ? d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : '—';
}
function initials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean).slice(0, 2);
  const out = parts.map((w) => w[0]).join('').toUpperCase();
  return out || '?';
}
function num(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}
function sumLines(lines) {
  return (lines || []).reduce((s, l) => s + num(l.line_total), 0);
}
function plural(n, one, many) {
  return `${n} ${n === 1 ? one : many}`;
}

const STATUS_STYLE = {
  draft:          { badge: 'b-gray',   dot: '#718096' },
  open:           { badge: 'b-blue',   dot: 'var(--blue)' },
  in_progress:    { badge: 'b-yellow', dot: 'var(--yellow)' },
  awaiting_parts: { badge: 'b-orange', dot: '#dd6b20' },
  ready:          { badge: 'b-purple', dot: 'var(--purple)' },
  completed:      { badge: 'b-green',  dot: 'var(--green)' },
  cancelled:      { badge: 'b-red',    dot: 'var(--red)' },
};
const statusStyle = (s) => STATUS_STYLE[s] || { badge: 'b-gray', dot: '#718096' };

/* ── Route: picker when there is no ?id=, history when there is ── */

const customerId = new URLSearchParams(window.location.search).get('id');
if (customerId) {
  loadHistory(customerId);
} else {
  renderPicker();
}

/* ============================================================
   Customer picker (no ?id= in the URL)
   ============================================================ */

function renderPicker() {
  content.innerHTML = `
    <div class="customer-hero">
      <div class="ch-name">Customer history</div>
      <div style="font-size:.78rem;color:var(--muted)">Pick a customer to see their vehicles, repair orders and totals.</div>
    </div>
    <div class="search-bar">
      <input class="search-input" id="cust-search" autocomplete="off"
             placeholder="Search customers by name, email or phone..."/>
    </div>
    <div class="card">
      <div class="card-hdr">
        Customers
        <span id="cust-count" style="font-size:.65rem;font-weight:400;color:var(--muted)"></span>
      </div>
      <div id="cust-list"></div>
    </div>`;

  const input = document.getElementById('cust-search');
  let timer = null;
  input.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => loadCustomers(input.value.trim()), 250);
  });

  loadCustomers('');
}

async function loadCustomers(search) {
  const list = document.getElementById('cust-list');
  const countEl = document.getElementById('cust-count');
  if (!list) return;
  countEl.textContent = '';

  const rows = await API.load(
    list,
    () => API.customers(search ? { search } : undefined),
    { empty: search ? 'No customers match that search.' : 'No customers yet.' }
  );
  if (!rows || !rows.length) return;

  countEl.textContent = plural(rows.length, 'customer', 'customers');
  list.innerHTML = rows.map((c) => `
    <a class="payment-row" href="customer-history.html?id=${encodeURIComponent(c.id)}"
       style="text-decoration:none;color:inherit;cursor:pointer">
      <span style="flex:1;min-width:0">
        <span style="font-weight:500;display:block">${esc(c.full_name)}</span>
        <span style="font-size:.68rem;color:var(--muted)">${esc([c.email, c.phone].filter(Boolean).join(' · ') || 'No contact details')}</span>
      </span>
      <span class="badge b-gray">${plural(num(c.vehicle_count), 'vehicle', 'vehicles')}</span>
      <span class="badge b-blue">${plural(num(c.repair_order_count), 'RO', 'ROs')}</span>
      <span style="color:var(--muted);width:96px;text-align:right;flex-shrink:0">${esc(API.date(c.last_service_date))}</span>
      <span style="font-weight:600;width:80px;text-align:right;flex-shrink:0">${esc(API.money(c.total_spent))}</span>
    </a>`).join('');
}

/* ============================================================
   Customer history (?id=…)
   ============================================================ */

async function loadHistory(id) {
  const data = await API.load(content, () => API.customerHistory(id));
  if (!data) return;
  renderHistory(data);
}

function renderHistory(data) {
  const customer = data.customer || {};
  const vehicles = data.vehicles || [];
  const repairOrders = data.repairOrders || [];
  const summary = data.summary || {};

  document.title = `AG Shop Pro — ${customer.full_name || 'Customer history'}`;

  content.innerHTML =
    heroHtml(customer, vehicles, summary) +
    `<div class="tab-bar">
       <button class="tab active" onclick="showTab('history',this)">Service history</button>
       <button class="tab" onclick="showTab('vehicles',this)">Vehicles</button>
       <button class="tab" onclick="showTab('spending',this)">Spending breakdown</button>
     </div>
     <div class="tab-content active" id="tab-history">${historyTabHtml(repairOrders, vehicles)}</div>
     <div class="tab-content" id="tab-vehicles">${vehiclesTabHtml(vehicles, repairOrders)}</div>
     <div class="tab-content" id="tab-spending">${spendingTabHtml(repairOrders)}</div>`;

  wireHistoryTab();
}

function heroHtml(c, vehicles, summary) {
  const s = AUTH.getSession();
  const workspace = s && s.activeWorkspaceName;
  const location = [c.address, c.city, c.state, c.zip_code].filter(Boolean).join(', ');
  const contact = [
    c.phone ? `<span>📞 ${esc(c.phone)}</span>` : '',
    c.email ? `<span>✉ ${esc(c.email)}</span>` : '',
    location ? `<span>📍 ${esc(location)}</span>` : '',
  ].filter(Boolean).join('') || '<span>No contact details on file</span>';

  return `
    <div class="customer-hero">
      <div class="ch-top">
        <div class="ch-avatar" style="background:#bee3f8;color:#2a4365">${esc(initials(c.full_name))}</div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <div class="ch-name">${esc(c.full_name || 'Unnamed customer')}</div>
            ${workspace ? `<span class="ch-source">${esc(workspace)}</span>` : ''}
          </div>
          <div class="ch-contact">${contact}</div>
          <div style="font-size:.72rem;color:var(--muted)">
            Customer since ${esc(API.date(c.created_at))} · Last visit: ${esc(API.date(summary.last_service_date))}
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:1.4rem;font-weight:600;color:var(--green)">${esc(API.money(summary.total_spent))}</div>
          <div style="font-size:.68rem;color:var(--muted)">Total spent · all time</div>
        </div>
      </div>
      <div class="ch-stats">
        <div class="ch-stat"><div class="ch-stat-val">${num(summary.total_repair_orders)}</div><div class="ch-stat-lbl">Repair orders</div></div>
        <div class="ch-stat"><div class="ch-stat-val">${vehicles.length}</div><div class="ch-stat-lbl">Vehicles</div></div>
        <div class="ch-stat"><div class="ch-stat-val">${esc(API.money(summary.avg_order_value))}</div><div class="ch-stat-lbl">Avg ticket</div></div>
        <div class="ch-stat"><div class="ch-stat-val">${esc(monthDay(summary.last_service_date))}</div><div class="ch-stat-lbl">Last visit</div></div>
        <div class="ch-stat"><div class="ch-stat-val" style="color:var(--green)">${num(summary.completed_orders)}</div><div class="ch-stat-lbl">Completed</div></div>
      </div>
    </div>`;
}

/* ── Service history tab ── */

function historyTabHtml(repairOrders, vehicles) {
  if (!repairOrders.length) {
    return `<div class="card">
        <div class="card-hdr">Repair orders</div>
        <div style="padding:24px;text-align:center;color:var(--muted)">No service history yet.</div>
      </div>`;
  }

  const options = vehicles.map((v) =>
    `<option value="${esc(v.id)}">${esc(API.vehicleLabel(v))}${v.plate ? ` · ${esc(v.plate)}` : ''}</option>`
  ).join('');

  return `
    <div class="search-bar">
      <input class="search-input" id="ro-search" autocomplete="off"
             placeholder="Search ROs by number, concern, vehicle..."/>
      <select id="ro-vehicle-filter" style="padding:7px 11px;border:1px solid var(--border);border-radius:8px;font-size:.75rem;font-family:'DM Sans',sans-serif;background:var(--card)">
        <option value="">All vehicles</option>
        ${options}
      </select>
    </div>
    <div class="card">
      <div class="card-hdr">
        All repair orders
        <span style="font-size:.65rem;font-weight:400;color:var(--muted)">${plural(repairOrders.length, 'repair order', 'repair orders')} · click to expand</span>
      </div>
      <div class="ro-timeline" id="ro-list">
        ${repairOrders.map(roRowHtml).join('')}
        <div id="ro-none" style="display:none;padding:24px;text-align:center;color:var(--muted)">No repair orders match those filters.</div>
      </div>
    </div>`;
}

function roRowHtml(ro) {
  const st = statusStyle(ro.status);
  const parts = ro.parts || [];
  const labor = ro.labor || [];
  const laborTotal = sumLines(labor);
  const partsTotal = sumLines(parts);
  const vehicle = API.vehicleLabel(ro);

  const totalItem = ro.total_final != null
    ? `<div class="ro-total-item">Total: <strong>${esc(API.money(ro.total_final))}</strong></div>`
    : `<div class="ro-total-item">Estimate: <strong>${esc(API.money(ro.total_estimate))}</strong></div>`;

  return `
    <div class="ro-row" data-vehicle="${esc(ro.vehicle_id)}">
      <div class="ro-date-col">
        <div class="ro-date">${esc(monthDay(ro.created_at))}</div>
        <div class="ro-year">${esc(yearOf(ro.created_at))}</div>
      </div>
      <div class="ro-dot" style="background:${st.dot}"></div>
      <div class="ro-body">
        <div class="ro-title">
          ${esc(ro.ro_number || `RO #${ro.id}`)}
          <span class="badge ${st.badge}">${esc(API.statusLabel(ro.status))}</span>
          ${ro.priority && ro.priority !== 'normal' ? `<span class="badge b-orange">${esc(API.statusLabel(ro.priority))}</span>` : ''}
        </div>
        <div class="ro-complaint">${esc(ro.concern || 'No concern recorded.')}</div>
        <div class="ro-totals">
          <div class="ro-total-item">Labor: <strong>${esc(API.money(laborTotal))}</strong></div>
          <div class="ro-total-item">Parts: <strong>${esc(API.money(partsTotal))}</strong></div>
          <div class="ro-total-item">Vehicle: <strong>${esc(vehicle)}${ro.plate ? ` · ${esc(ro.plate)}` : ''}</strong></div>
          ${totalItem}
        </div>
        <div class="ro-detail">
          <div class="lines-grid">
            <div class="lines-section">
              <div class="lines-hdr">Labor lines</div>
              ${labor.length ? labor.map(laborLineHtml).join('') : emptyLineHtml('No labor lines on this RO.')}
            </div>
            <div class="lines-section">
              <div class="lines-hdr">Parts lines</div>
              ${parts.length ? parts.map(partLineHtml).join('') : emptyLineHtml('No parts lines on this RO.')}
            </div>
          </div>
          ${ro.notes ? `<div style="margin-top:8px;padding:8px 10px;background:#f8fafc;border-radius:8px;font-size:.72rem;color:var(--muted);line-height:1.5"><strong style="color:var(--text)">Notes:</strong> ${esc(ro.notes)}</div>` : ''}
          <div style="margin-top:8px;font-size:.65rem;color:var(--muted)">
            Opened ${esc(API.dateTime(ro.created_at))}${ro.actual_completion ? ` · Completed ${esc(API.dateTime(ro.actual_completion))}` : (ro.estimated_completion ? ` · Est. completion ${esc(API.date(ro.estimated_completion))}` : '')}
          </div>
        </div>
      </div>
    </div>`;
}

function emptyLineHtml(message) {
  return `<div class="line-item"><div class="line-desc" style="color:var(--muted)">${esc(message)}</div></div>`;
}

function laborLineHtml(l) {
  const meta = [
    l.technician_name ? esc(l.technician_name) : 'Unassigned',
    l.hours != null ? `${esc(l.hours)}h` : null,
    l.hourly_rate != null ? `@ ${esc(API.money(l.hourly_rate))}/h` : null,
  ].filter(Boolean).join(' · ');
  return `
    <div class="line-item">
      <div class="line-dot" style="background:#3182ce"></div>
      <div style="flex:1">
        <div class="line-desc">${esc(l.description || 'Labor')}</div>
        <div class="line-cat">${meta}</div>
      </div>
      <div class="line-amt">${esc(API.money(l.line_total))}</div>
    </div>`;
}

function partLineHtml(p) {
  const meta = [
    p.part_number ? esc(p.part_number) : null,
    p.quantity != null ? `× ${esc(p.quantity)}` : null,
    p.unit_price != null ? `@ ${esc(API.money(p.unit_price))}` : null,
  ].filter(Boolean).join(' · ');
  return `
    <div class="line-item">
      <div class="line-dot" style="background:#805ad5"></div>
      <div style="flex:1">
        <div class="line-desc">${esc(p.part_name || 'Part')}</div>
        <div class="line-cat">${meta || '—'}</div>
      </div>
      <div class="line-amt">${esc(API.money(p.line_total))}</div>
    </div>`;
}

function wireHistoryTab() {
  const list = document.getElementById('ro-list');
  if (list) {
    list.addEventListener('click', (ev) => {
      const row = ev.target.closest('.ro-row');
      if (row) toggleRO(row);
    });
  }
  const search = document.getElementById('ro-search');
  if (search) search.addEventListener('input', applyRoFilter);
  const filter = document.getElementById('ro-vehicle-filter');
  if (filter) filter.addEventListener('change', applyRoFilter);
}

function toggleRO(row) {
  const detail = row.querySelector('.ro-detail');
  if (!detail) return;
  const isOpen = detail.classList.contains('open');
  /* Close all others */
  document.querySelectorAll('.ro-detail.open').forEach((d) => d.classList.remove('open'));
  document.querySelectorAll('.ro-row.expanded').forEach((r) => r.classList.remove('expanded'));
  if (!isOpen) {
    detail.classList.add('open');
    row.classList.add('expanded');
  }
}

function applyRoFilter() {
  const searchEl = document.getElementById('ro-search');
  const filterEl = document.getElementById('ro-vehicle-filter');
  const q = (searchEl ? searchEl.value : '').trim().toLowerCase();
  const vehicleId = filterEl ? filterEl.value : '';
  let shown = 0;

  document.querySelectorAll('#ro-list .ro-row').forEach((row) => {
    const matchesVehicle = !vehicleId || row.dataset.vehicle === vehicleId;
    const matchesQuery = !q || row.textContent.toLowerCase().includes(q);
    const show = matchesVehicle && matchesQuery;
    row.style.display = show ? '' : 'none';
    if (show) shown++;
  });

  const none = document.getElementById('ro-none');
  if (none) none.style.display = shown ? 'none' : '';
}

/* ── Vehicles tab ── */

function vehiclesTabHtml(vehicles, repairOrders) {
  if (!vehicles.length) {
    return `<div class="card">
        <div class="card-hdr">Vehicles</div>
        <div style="padding:24px;text-align:center;color:var(--muted)">No vehicles on file for this customer.</div>
      </div>`;
  }
  return vehicles.map((v) => vehicleCardHtml(v, repairOrders.filter((ro) => ro.vehicle_id === v.id))).join('');
}

function vehicleCardHtml(v, ros) {
  const visits = num(v.repair_order_count);
  const mileage = v.mileage != null && v.mileage !== '' ? `${num(v.mileage).toLocaleString('en-US')} mi` : '—';

  return `
    <div class="vehicle-card">
      <div class="vc-top" style="cursor:default">
        <div class="vc-icon">🚗</div>
        <div style="flex:1">
          <div class="vc-year" style="font-size:1rem">${esc(API.vehicleLabel(v))}</div>
          ${v.plate ? `<div class="vc-make">Plate: ${esc(v.plate)}</div>` : ''}
          <div class="vc-vin">VIN: ${esc(v.vin || '—')}</div>
          <div class="vc-badges">
            <span class="badge b-gray">${plural(visits, 'visit', 'visits')}</span>
            ${v.last_service_date
              ? `<span class="badge b-green">Last in ${esc(monthYear(v.last_service_date))}</span>`
              : '<span class="badge b-yellow">No visits yet</span>'}
            <span class="badge b-blue">Added ${esc(monthYear(v.created_at))}</span>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:1rem;font-weight:600">${esc(mileage)}</div>
          <div style="font-size:.68rem;color:var(--muted)">Current mileage</div>
        </div>
      </div>
      ${visitTrackHtml(ros)}
    </div>`;
}

/* The repair orders for this vehicle, oldest first. The API exposes one
   current odometer reading per vehicle, not a reading per visit, so this
   track plots visits — not a mileage history. */
function visitTrackHtml(ros) {
  if (!ros.length) {
    return `<div class="mileage-timeline">
        <div class="ml-title">Visits</div>
        <div style="font-size:.72rem;color:var(--muted)">No repair orders for this vehicle yet.</div>
      </div>`;
  }
  const ordered = ros.slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  const points = ordered.map((ro, i) => {
    const isLast = i === ordered.length - 1;
    const st = statusStyle(ro.status);
    return `<div class="ml-point">
        <div class="ml-dot" style="background:${st.dot}"></div>
        <div class="ml-mileage"${isLast ? ' style="color:var(--green)"' : ''}>${esc(ro.ro_number || `#${ro.id}`)}</div>
        <div class="ml-date">${esc(monthYear(ro.created_at))}</div>
      </div>`;
  });
  return `<div class="mileage-timeline">
      <div class="ml-title">Visits (from repair orders)</div>
      <div class="ml-track">${points.join('<div class="ml-line"></div>')}</div>
    </div>`;
}

/* ── Spending tab ── */

function spendingTabHtml(repairOrders) {
  if (!repairOrders.length) {
    return `<div class="card">
        <div class="card-hdr">Spending breakdown</div>
        <div style="padding:24px;text-align:center;color:var(--muted)">No service history yet.</div>
      </div>`;
  }
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      ${partsVsLaborHtml(repairOrders)}
      ${yearOverYearHtml(repairOrders)}
    </div>`;
}

function partsVsLaborHtml(repairOrders) {
  const labor = repairOrders.reduce((s, ro) => s + sumLines(ro.labor), 0);
  const parts = repairOrders.reduce((s, ro) => s + sumLines(ro.parts), 0);
  const total = labor + parts;

  const bar = (label, value, color) => {
    const pct = total > 0 ? (value / total) * 100 : 0;
    return `<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:4px">
          <span>${esc(label)}</span>
          <span style="font-weight:500">${esc(API.money(value))}
            <span style="color:var(--muted);font-weight:400">(${pct.toFixed(1)}%)</span>
          </span>
        </div>
        <div class="category-bar"><div class="category-fill" style="width:${pct.toFixed(1)}%;background:${color}"></div></div>
      </div>`;
  };

  return `<div class="card">
      <div class="card-hdr">
        Parts vs labor
        <span style="font-size:.65rem;font-weight:400;color:var(--muted)">Summed from RO line items</span>
      </div>
      <div style="padding:14px">
        ${total > 0
          ? bar('Labor', labor, '#3182ce') + bar('Parts', parts, '#805ad5')
          : '<div style="font-size:.75rem;color:var(--muted)">No parts or labor lines recorded on these repair orders.</div>'}
        <div style="padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:.8rem;margin-top:10px">
          <span>Line item total</span><strong>${esc(API.money(total))}</strong>
        </div>
      </div>
    </div>`;
}

function yearOverYearHtml(repairOrders) {
  const byYear = new Map();
  repairOrders.forEach((ro) => {
    const y = yearOf(ro.created_at);
    if (!y) return;
    byYear.set(y, (byYear.get(y) || 0) + num(ro.total_final));
  });

  const years = [...byYear.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  const max = years.reduce((m, [, v]) => Math.max(m, v), 0);
  const latest = years.length ? years[years.length - 1][0] : null;

  const rows = years.map(([year, value], i) => {
    const pct = max > 0 ? (value / max) * 100 : 0;
    const isLatest = year === latest;
    const last = i === years.length - 1;
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;${last ? '' : 'border-bottom:1px solid var(--border);'}font-size:.78rem">
        <span>${esc(year)}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:60px;height:6px;background:#edf2f7;border-radius:50px;overflow:hidden">
            <div style="width:${pct.toFixed(1)}%;height:100%;background:${isLatest ? 'var(--accent)' : '#3182ce'};border-radius:50px"></div>
          </div>
          <strong${isLatest ? ' style="color:var(--accent)"' : ''}>${esc(API.money(value))}</strong>
        </div>
      </div>`;
  });

  return `<div class="card">
      <div class="card-hdr">
        Year over year
        <span style="font-size:.65rem;font-weight:400;color:var(--muted)">Invoiced totals</span>
      </div>
      <div style="padding:14px">
        ${rows.length ? rows.join('') : '<div style="font-size:.75rem;color:var(--muted)">No dated repair orders.</div>'}
      </div>
    </div>`;
}

/* ── Tabs ── */

function showTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach((t) => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}
</script>
</body>
</html>
