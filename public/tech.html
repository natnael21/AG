<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>AG Shop Pro — Technician</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--navy:#0a1628;--navy2:#111f35;--accent:#e94560;--gold:#c9a84c;--bg:#f0f2f7;--card:#fff;--border:#e2e8f0;--text:#1a2035;--muted:#718096;--green:#2f855a;--yellow:#b7791f;--red:#c53030;--blue:#2b6cb0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--navy);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.brand{font-size:.9rem;font-weight:500;color:#fff}
.brand span{color:var(--accent)}
.tech-info{text-align:right}
.tech-name{font-size:.78rem;font-weight:500;color:#fff}
.tech-status{font-size:.65rem;color:rgba(255,255,255,.4)}
.clock-status{font-size:.78rem;font-weight:600;color:#68d391}
.content{flex:1;padding:12px;padding-bottom:80px}
.clock-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.clock-time{text-align:center;flex-shrink:0}
.clock-big{font-size:1.8rem;font-weight:600;color:var(--text)}
.clock-date{font-size:.68rem;color:var(--muted)}
.clock-btn{flex:1;padding:14px;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-clk-in{background:var(--green);color:#fff}
.btn-clk-out{background:var(--red);color:#fff}
.btn-clk-in:active,.btn-clk-out:active{transform:scale(.97)}
.section-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;margin-bottom:8px;margin-top:6px}
.ro-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px}
.ro-card-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ro-number{font-size:.92rem;font-weight:600}
.ro-customer{font-size:.72rem;color:var(--muted)}
.ro-vehicle{font-size:.72rem;color:var(--muted);margin-top:1px}
.ro-complaint{padding:10px 14px;font-size:.78rem;color:var(--muted);border-bottom:1px solid var(--border);line-height:1.5}
.status-buttons{padding:10px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;border-bottom:1px solid var(--border)}
.status-big-btn{padding:12px 6px;border-radius:10px;font-size:.75rem;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .2s;text-align:center}
.status-big-btn:active{transform:scale(.96)}
.btn-start{background:#bee3f8;color:#2a4365}
.btn-pause{background:#fefcbf;color:#744210}
.btn-done{background:#c6f6d5;color:#276749}
.parts-section{padding:10px 14px;border-bottom:1px solid var(--border)}
.parts-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:6px}
.part-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:.75rem;border-bottom:1px solid var(--border)}
.part-row:last-child{border-bottom:none}
.part-name{color:var(--text)}
.note-section{padding:10px 14px}
.note-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:.82rem;font-family:'DM Sans',sans-serif;background:var(--bg);resize:none;min-height:60px;color:var(--text)}
.note-input:focus{outline:none;border-color:var(--accent)}
.note-footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.note-hint{font-size:.65rem;color:var(--muted)}
.note-btn{padding:7px 14px;border-radius:8px;font-size:.75rem;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;background:var(--accent);color:#fff}
.badge{display:inline-flex;padding:2px 8px;border-radius:50px;font-size:.65rem;font-weight:600}
.badge-green{background:#c6f6d5;color:#276749}
.badge-yellow{background:#fefcbf;color:#744210}
.badge-blue{background:#bee3f8;color:#2a4365}
.badge-red{background:#fed7d7;color:#822727}
.badge-gray{background:#edf2f7;color:#4a5568}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);padding:8px 16px 16px;display:flex;justify-content:space-around}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.62rem;color:var(--muted);cursor:pointer;padding:6px 12px;border-radius:8px;transition:all .15s;border:none;background:none;font-family:'DM Sans',sans-serif}
.nav-btn.active,.nav-btn:hover{color:var(--accent)}
.nav-icon{font-size:1.1rem}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:.78rem;z-index:9999;opacity:0;transition:all .3s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.page{display:none}
.page.active{display:block}
.history-row{padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.history-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.82rem;flex-shrink:0}
.history-info{flex:1}
.history-title{font-size:.78rem;font-weight:600}
.history-sub{font-size:.68rem;color:var(--muted)}
.profile-section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px}
.profile-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:10px}
.profile-row{display:flex;justify-content:space-between;font-size:.78rem;padding:6px 0;border-bottom:1px solid var(--border)}
.profile-row:last-child{border-bottom:none}
</style>
</head>
<body>
<script src="auth.js"></script>
<script src="api.js"></script>
<script>
(function(){
  var s = AUTH.requireRoles(['technician', 'manager', 'super_admin']);
  if(!s) return;
})();
</script>

<div class="topbar">
  <div>
    <div class="brand">AG <span>Shop Pro</span></div>
    <div style="font-size:.62rem;color:rgba(255,255,255,.35)">Technician portal</div>
  </div>
  <div class="tech-info">
    <div class="tech-name" id="topbar-name">—</div>
    <div id="clock-status" class="clock-status">—</div>
    <div class="tech-status" id="live-time">—</div>
  </div>
</div>

<div class="content">

  <!-- MY ROs PAGE -->
  <div class="page active" id="page-ros">
    <div class="clock-card">
      <div class="clock-time">
        <div class="clock-big" id="clock-display">—</div>
        <div class="clock-date" id="clock-date">—</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <div class="note-hint" id="clock-target">—</div>
        <button class="clock-btn btn-clk-in" id="main-clock-btn" type="button">Clock In</button>
      </div>
    </div>

    <div class="section-label">Active repair orders</div>
    <div id="ro-list"></div>
  </div>

  <!-- TIME PAGE -->
  <div class="page" id="page-time">
    <div class="section-label">Current time entry</div>
    <div class="profile-section" id="time-open"></div>

    <div class="section-label">My completed time entries</div>
    <div class="profile-section" id="time-entries"></div>
    <div class="note-hint" id="time-scope" style="margin-bottom:10px"></div>

    <div class="section-label">Clock in / out</div>
    <div class="clock-card">
      <div class="clock-time">
        <div class="clock-big" id="clock-display2">—</div>
        <div class="clock-date" id="clock-date2">—</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <div class="note-hint" id="clock-target2">—</div>
        <button class="clock-btn btn-clk-in" id="time-clock-btn" type="button">Clock In</button>
      </div>
    </div>
  </div>

  <!-- HISTORY PAGE -->
  <div class="page" id="page-history">
    <div class="section-label">Completed repair orders</div>
    <div class="profile-section" id="history-list"></div>

    <div id="perf-block" style="display:none">
      <div class="section-label">Team performance this month</div>
      <div class="profile-section" id="perf-list"></div>
    </div>
  </div>

  <!-- PROFILE PAGE -->
  <div class="page" id="page-profile">
    <div style="text-align:center;padding:20px 0">
      <div style="width:64px;height:64px;border-radius:50%;background:rgba(233,69,96,.15);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:600;color:var(--accent);margin:0 auto 10px" id="profile-initials">—</div>
      <div style="font-size:1.1rem;font-weight:600" id="profile-name">—</div>
      <div style="font-size:.75rem;color:var(--muted)" id="profile-sub">—</div>
    </div>
    <div class="profile-section">
      <div class="profile-label">My info</div>
      <div class="profile-row"><span style="color:var(--muted)">Shop</span><span id="profile-shop">—</span></div>
      <div class="profile-row"><span style="color:var(--muted)">Email</span><span id="profile-email">—</span></div>
      <div class="profile-row"><span style="color:var(--muted)">Role</span><span id="profile-role">—</span></div>
    </div>
    <button style="width:100%;padding:13px;border-radius:10px;background:var(--navy);color:#fff;border:none;font-size:.85rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px" id="signout-btn" type="button">Sign out</button>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-ros" onclick="showPage('ros',this)"><span class="nav-icon">🔧</span>My ROs</button>
  <button class="nav-btn" id="nav-time" onclick="showPage('time',this)"><span class="nav-icon">⏱</span>Time</button>
  <button class="nav-btn" id="nav-history" onclick="showPage('history',this)"><span class="nav-icon">📋</span>History</button>
  <button class="nav-btn" id="nav-profile" onclick="showPage('profile',this)"><span class="nav-icon">👤</span>Profile</button>
</div>

<script>
/* ============================================================
   Technician portal — all data comes from the API. Nothing on
   this page is seeded, mocked or precomputed in the markup.
   ============================================================ */

var SESSION = AUTH.getSession() || {};
var MY_ID = SESSION.id;
var CAN_REPORT = ['manager', 'super_admin'].indexOf(SESSION.role) !== -1;

/* Statuses a technician still has work to do on. */
var ACTIVE_STATUSES = ['open', 'in_progress', 'awaiting_parts', 'ready'];

/* The repair-order list carries no time entries, so the Time page derives them
   from RO details. That is one request per RO, hence a bounded scan. */
var TIME_SCAN_LIMIT = 25;

var BADGE = {
  open: 'badge-gray',
  in_progress: 'badge-blue',
  awaiting_parts: 'badge-yellow',
  ready: 'badge-green',
  completed: 'badge-green',
  cancelled: 'badge-red',
};

var openEntry = null;   // the tech's single open time entry, or null
var roCache = [];       // active ROs currently rendered

/* ── helpers ── */

function isAuthError(e) {
  return e && (e.message === 'Session expired' || e.message === 'Unauthorized');
}

function reportError(e) {
  if (!isAuthError(e)) API.toast(e.message || 'Something went wrong.', 'error');
}

function hoursFromMinutes(mins) {
  var m = Number(mins);
  if (!isFinite(m) || m < 0) return '—';
  return (m / 60).toFixed(1) + 'h';
}

function elapsedSince(start) {
  var t = new Date(start).getTime();
  if (isNaN(t)) return '—';
  return hoursFromMinutes(Math.max(Math.round((Date.now() - t) / 60000), 0));
}

/* Run `fn` over `items` with a small concurrency cap. Rejects on first error so
   a partial failure surfaces rather than showing a silently short list. */
async function mapLimit(items, limit, fn) {
  var out = new Array(items.length);
  var next = 0;
  async function worker() {
    while (next < items.length) {
      var i = next++;
      out[i] = await fn(items[i], i);
    }
  }
  var workers = [];
  for (var i = 0; i < Math.min(limit, items.length); i++) workers.push(worker());
  await Promise.all(workers);
  return out;
}

function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function (b) { b.classList.remove('active'); });
  document.getElementById('page-' + id).classList.add('active');
  if (btn) btn.classList.add('active');
  if (id === 'time') loadTime();
  if (id === 'history') loadHistory();
}

/* ── live wall clock ── */

function now() {
  return new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function updateClock() {
  var t = now();
  var d = API.date(new Date());
  ['clock-display', 'clock-display2', 'live-time'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.textContent = t;
  });
  ['clock-date', 'clock-date2'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.textContent = d;
  });
  if (openEntry) renderClock();
}

/* ── clock state (server is the source of truth) ── */

async function refreshOpenEntry() {
  try {
    openEntry = await API.get('/api/time/open');
  } catch (e) {
    openEntry = null;
    reportError(e);
  }
  renderClock();
}

function renderClock() {
  var status = document.getElementById('clock-status');
  var clockedIn = !!openEntry;

  if (status) {
    status.textContent = clockedIn ? '● Clocked in' : '○ Clocked out';
    status.style.color = clockedIn ? '#68d391' : 'rgba(255,255,255,.4)';
  }

  [['main-clock-btn', 'clock-target'], ['time-clock-btn', 'clock-target2']].forEach(function (pair) {
    var btn = document.getElementById(pair[0]);
    var target = document.getElementById(pair[1]);
    if (btn) {
      btn.className = 'clock-btn ' + (clockedIn ? 'btn-clk-out' : 'btn-clk-in');
      btn.textContent = clockedIn ? 'Clock Out' : 'Clock In';
      /* Clocking in needs a repair order, so it is driven from an RO card. */
      btn.disabled = !clockedIn;
      btn.style.opacity = clockedIn ? '1' : '.5';
      btn.style.cursor = clockedIn ? 'pointer' : 'not-allowed';
    }
    if (target) {
      target.textContent = clockedIn
        ? 'On ' + (openEntry.ro_number || ('RO #' + openEntry.repair_order_id)) +
          ' · since ' + API.dateTime(openEntry.start_time)
        : 'Not clocked in — use “Clock in” on a repair order below.';
    }
  });
}

async function clockOutOpen(btn) {
  if (!openEntry) return;
  btn.disabled = true;
  try {
    await API.clockOut(openEntry.repair_order_id);
    API.toast('Clocked out.', 'success');
  } catch (e) {
    reportError(e);
  }
  await refreshOpenEntry();
  renderROs(roCache);
  if (document.getElementById('page-time').classList.contains('active')) loadTime();
}

/* ── My ROs ── */

async function loadROs() {
  var el = document.getElementById('ro-list');
  await API.load(el, async function () {
    var list = await API.repairOrders();
    var active = (list || []).filter(function (r) {
      return ACTIVE_STATUSES.indexOf(r.status) !== -1;
    });
    roCache = active;
    if (active.length) renderROs(active);
    return active;
  }, { empty: 'No repair orders assigned yet.' });
}

function roCardHtml(ro) {
  var vehicle = API.escape(API.vehicleLabel(ro));
  if (ro.plate) vehicle += ' · ' + API.escape(ro.plate);

  var badgeClass = BADGE[ro.status] || 'badge-gray';
  var clockedHere = openEntry && Number(openEntry.repair_order_id) === Number(ro.id);
  var doneTarget = ro.status === 'ready' ? 'completed' : 'ready';

  var actions = '' +
    '<div class="status-buttons">' +
      '<button class="status-big-btn btn-start" data-act="status" data-id="' + ro.id + '" data-target="in_progress">▶ Start</button>' +
      '<button class="status-big-btn btn-pause" data-act="status" data-id="' + ro.id + '" data-target="awaiting_parts">⏸ Pause</button>' +
      '<button class="status-big-btn btn-done" data-act="status" data-id="' + ro.id + '" data-target="' + doneTarget + '">✓ ' +
        (doneTarget === 'completed' ? 'Complete' : 'Done') + '</button>' +
    '</div>' +
    '<div class="status-buttons">' +
      '<button class="status-big-btn ' + (clockedHere ? 'btn-pause' : 'btn-start') + '" style="grid-column:1/-1" ' +
        'data-act="' + (clockedHere ? 'clock-out' : 'clock-in') + '" data-id="' + ro.id + '">' +
        (clockedHere ? '⏹ Clock out of this RO' : '⏱ Clock in to this RO') +
      '</button>' +
    '</div>';

  return '' +
    '<div class="ro-card" data-ro="' + ro.id + '">' +
      '<div class="ro-card-header">' +
        '<div>' +
          '<div class="ro-number">' + API.escape(ro.ro_number) + '</div>' +
          '<div class="ro-customer">' + API.escape(ro.customer_name || '—') + '</div>' +
          '<div class="ro-vehicle">' + vehicle + '</div>' +
        '</div>' +
        '<span class="badge ' + badgeClass + '">' + API.escape(API.statusLabel(ro.status)) + '</span>' +
      '</div>' +
      '<div class="ro-complaint">' + API.escape(ro.concern || 'No concern recorded.') + '</div>' +
      actions +
      '<div class="parts-section" data-parts="' + ro.id + '"></div>' +
      '<div class="note-section">' +
        '<form data-labor="' + ro.id + '">' +
          '<textarea class="note-input" name="description" placeholder="Labor performed…"></textarea>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">' +
            '<input class="note-input" style="min-height:0" type="number" step="0.1" min="0.01" name="hours" placeholder="Hours"/>' +
            '<input class="note-input" style="min-height:0" type="number" step="0.01" min="0" name="hourlyRate" placeholder="Rate $/h"/>' +
          '</div>' +
          '<div class="note-footer">' +
            '<span class="note-hint">Saved as a labor line on this RO</span>' +
            '<button class="note-btn" type="submit">Add labor</button>' +
          '</div>' +
        '</form>' +
      '</div>' +
    '</div>';
}

function renderROs(list) {
  var el = document.getElementById('ro-list');
  if (!el) return;
  el.innerHTML = list.map(roCardHtml).join('');
  list.forEach(function (ro) {
    loadParts(ro.id);
    wireLaborForm(ro.id);
  });
}

async function loadParts(id) {
  var el = document.querySelector('[data-parts="' + id + '"]');
  if (!el) return;
  el.innerHTML = '<div class="parts-label">Parts</div><div class="note-hint">Loading…</div>';
  try {
    var ro = await API.repairOrder(id);
    renderParts(el, ro && ro.parts);
  } catch (e) {
    if (isAuthError(e)) return;
    API.showError(el, e.message, null, function () { loadParts(id); });
  }
}

function renderParts(el, parts) {
  if (!parts || !parts.length) {
    el.innerHTML = '<div class="parts-label">Parts</div><div class="note-hint">No parts on this repair order.</div>';
    return;
  }
  el.innerHTML = '<div class="parts-label">Parts</div>' + parts.map(function (p) {
    var name = API.escape(p.part_name || 'Part');
    var num = p.part_number ? ' · ' + API.escape(p.part_number) : '';
    var qty = Number(p.quantity) || 0;
    return '<div class="part-row">' +
      '<span class="part-name">' + name + num + '</span>' +
      '<span class="badge badge-gray">×' + qty + ' · ' + API.money(p.line_total) + '</span>' +
    '</div>';
  }).join('');
}

function wireLaborForm(id) {
  var form = document.querySelector('[data-labor="' + id + '"]');
  if (!form) return;
  API.onSubmit(form, async function (data) {
    await API.addLabor(id, {
      description: data.description.trim(),
      hours: Number(data.hours),
      hourlyRate: Number(data.hourlyRate),
    });
    form.reset();
    API.toast('Labor added.', 'success');
  }, {
    validate: function (data) {
      var errors = {};
      if (!data.description || !data.description.trim()) errors.description = 'Describe the labor performed.';
      if (!(Number(data.hours) > 0)) errors.hours = 'Enter hours greater than 0.';
      if (!(Number(data.hourlyRate) >= 0)) errors.hourlyRate = 'Enter an hourly rate.';
      return errors;
    },
  });
}

/* ── RO card actions ── */

document.getElementById('ro-list').addEventListener('click', function (ev) {
  var btn = ev.target.closest('[data-act]');
  if (!btn) return;
  var act = btn.getAttribute('data-act');
  var id = Number(btn.getAttribute('data-id'));
  if (act === 'status') setStatus(btn, id, btn.getAttribute('data-target'));
  if (act === 'clock-in') clockInTo(btn, id);
  if (act === 'clock-out') clockOutFrom(btn, id);
});

function lockCard(btn, locked) {
  var card = btn.closest('.ro-card');
  if (!card) return;
  card.querySelectorAll('button').forEach(function (b) { b.disabled = locked; });
}

async function setStatus(btn, id, target) {
  lockCard(btn, true);
  try {
    await API.setROStatus(id, target);
    API.toast('Status set to ' + API.statusLabel(target) + '.', 'success');
    await loadROs();     // re-read from the server rather than assuming
  } catch (e) {
    reportError(e);      // includes the server's 409 workflow message
    lockCard(btn, false);
  }
}

async function clockInTo(btn, id) {
  lockCard(btn, true);
  try {
    await API.clockIn(id);
    API.toast('Clocked in.', 'success');
  } catch (e) {
    reportError(e);      // includes the 409 naming the other RO
  }
  await refreshOpenEntry();
  renderROs(roCache);
}

async function clockOutFrom(btn, id) {
  lockCard(btn, true);
  try {
    await API.clockOut(id);
    API.toast('Clocked out.', 'success');
  } catch (e) {
    reportError(e);
  }
  await refreshOpenEntry();
  renderROs(roCache);
}

/* ── Time page ── */

function renderOpenEntry() {
  var el = document.getElementById('time-open');
  if (!el) return;
  if (!openEntry) {
    el.innerHTML = '<div class="note-hint" style="text-align:center;padding:8px 0">Not clocked in.</div>';
    return;
  }
  el.innerHTML = '' +
    '<div class="profile-row"><span style="color:var(--muted)">Repair order</span><span style="font-weight:600">' +
      API.escape(openEntry.ro_number || ('RO #' + openEntry.repair_order_id)) + '</span></div>' +
    '<div class="profile-row"><span style="color:var(--muted)">Clock in</span><span>' +
      API.dateTime(openEntry.start_time) + '</span></div>' +
    '<div class="profile-row"><span style="color:var(--muted)">Elapsed</span><span style="font-weight:600;color:var(--green)">' +
      elapsedSince(openEntry.start_time) + ' (ongoing)</span></div>';
}

async function loadTime() {
  await refreshOpenEntry();
  renderOpenEntry();

  var el = document.getElementById('time-entries');
  var scope = document.getElementById('time-scope');
  if (scope) scope.textContent = '';

  await API.load(el, async function () {
    var list = await API.repairOrders({ limit: TIME_SCAN_LIMIT });
    var details = await mapLimit(list || [], 4, function (r) { return API.repairOrder(r.id); });

    var entries = [];
    details.forEach(function (d) {
      if (!d) return;
      (d.timeEntries || []).forEach(function (te) {
        if (Number(te.technician_id) === Number(MY_ID) && te.end_time) {
          entries.push({ te: te, ro_number: d.ro_number });
        }
      });
    });
    entries.sort(function (a, b) {
      return new Date(b.te.start_time) - new Date(a.te.start_time);
    });

    if (entries.length) renderTimeEntries(el, entries, (list || []).length);
    return entries;
  }, { empty: 'No completed time entries on your recent repair orders.' });
}

function renderTimeEntries(el, entries, scanned) {
  var total = entries.reduce(function (sum, e) {
    var m = Number(e.te.duration_minutes);
    return sum + (isFinite(m) && m > 0 ? m : 0);
  }, 0);

  el.innerHTML = entries.map(function (e) {
    return '<div class="profile-row">' +
      '<span style="color:var(--muted)">' + API.escape(e.ro_number) + ' · ' + API.date(e.te.start_time) + '</span>' +
      '<span style="font-weight:600">' + hoursFromMinutes(e.te.duration_minutes) + '</span>' +
    '</div>';
  }).join('') +
  '<div class="profile-row"><span style="font-weight:600">Total shown</span>' +
    '<span style="font-weight:600">' + hoursFromMinutes(total) + '</span></div>';

  var scope = document.getElementById('time-scope');
  if (scope) {
    scope.textContent = 'From your ' + scanned + ' most recent repair order' + (scanned === 1 ? '' : 's') +
      '. The API exposes no per-technician time report, so this is not an all-time total.';
  }
}

/* ── History page ── */

async function loadHistory() {
  var el = document.getElementById('history-list');
  await API.load(el, async function () {
    var list = await API.repairOrders({ status: 'completed' });
    if (list && list.length) renderHistory(el, list);
    return list;
  }, { empty: 'No completed repair orders yet.' });

  loadPerformance();
}

function renderHistory(el, list) {
  el.innerHTML = list.map(function (ro) {
    var vehicle = API.vehicleLabel(ro);
    return '<div class="history-row">' +
      '<div class="history-icon" style="background:#c6f6d5;color:#276749">✓</div>' +
      '<div class="history-info">' +
        '<div class="history-title">' + API.escape(ro.ro_number) + ' · ' + API.escape(ro.customer_name || '—') + '</div>' +
        '<div class="history-sub">' + API.escape(vehicle) + ' · ' + API.escape(ro.concern || '—') +
          ' · Completed ' + API.date(ro.actual_completion || ro.updated_at || ro.created_at) + '</div>' +
      '</div>' +
      '<span style="font-size:.75rem;font-weight:600;color:var(--green)">' + API.money(ro.total_final) + '</span>' +
    '</div>';
  }).join('');
}

/* Technician-performance is manager-gated (403 for technicians), so it is only
   requested for roles that can actually read it. */
function loadPerformance() {
  var block = document.getElementById('perf-block');
  if (!CAN_REPORT || !block) return;
  block.style.display = '';

  var el = document.getElementById('perf-list');
  var today = new Date();
  var start = new Date(today.getFullYear(), today.getMonth(), 1);
  var iso = function (d) { return d.toISOString().slice(0, 10); };

  return API.load(el, async function () {
    var rows = await API.techPerformance({ startDate: iso(start), endDate: iso(today) });
    if (rows && rows.length) renderPerformance(el, rows);
    return rows;
  }, { empty: 'No technician activity this month.' });
}

function renderPerformance(el, rows) {
  el.innerHTML = rows.map(function (r) {
    return '<div class="profile-row">' +
      '<span style="color:var(--muted)">' + API.escape(r.name) + '</span>' +
      '<span style="font-weight:600">' + (Number(r.repair_orders_completed) || 0) + ' ROs · ' +
        (Number(r.total_hours) || 0).toFixed(1) + 'h · ' + API.money(r.labor_revenue) + '</span>' +
    '</div>';
  }).join('');
}

/* ── Profile & topbar ── */

function initials(name) {
  return String(name || '')
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map(function (w) { return w[0].toUpperCase(); })
    .join('') || '—';
}

function renderProfile() {
  var name = SESSION.name || '—';
  var shop = SESSION.activeWorkspaceName || '—';
  var role = API.statusLabel(SESSION.role);

  document.getElementById('topbar-name').textContent = name;
  document.getElementById('profile-initials').textContent = initials(SESSION.name);
  document.getElementById('profile-name').textContent = name;
  document.getElementById('profile-sub').textContent = role + ' · ' + shop;
  document.getElementById('profile-shop').textContent = shop;
  document.getElementById('profile-email').textContent = SESSION.email || '—';
  document.getElementById('profile-role').textContent = role;
}

document.getElementById('signout-btn').addEventListener('click', function () { AUTH.logout(); });
document.getElementById('main-clock-btn').addEventListener('click', function () { clockOutOpen(this); });
document.getElementById('time-clock-btn').addEventListener('click', function () { clockOutOpen(this); });

/* ── boot ── */

renderProfile();
updateClock();
setInterval(updateClock, 30000);

(async function init() {
  await refreshOpenEntry();
  await loadROs();
})();
</script>
</body>
