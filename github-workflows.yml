# ─────────────────────────────────────────────────────────────────────────────
# FILE 1: .github/workflows/deploy-preprod.yml
# Triggers when you push/merge into the `staging` branch.
# Deploys to preprod.agshopro.com automatically.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Preprod

on:
  push:
    branches: [staging]

jobs:
  deploy-preprod:
    name: Deploy → preprod.agshopro.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate release ID
        id: release
        run: echo "id=$(date +%Y%m%d_%H%M%S)_${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Copy code to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/tmp/agshopro-release-preprod"
          rm: true                      # wipe old temp copy first

      - name: Run deploy script on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            bash /var/www/agshopro-preprod/scripts/deploy.sh ${{ steps.release.outputs.id }}

      - name: Healthcheck preprod
        run: |
          echo "Waiting for process to come up..."
          sleep 8
          curl --fail --retry 5 --retry-delay 5 --max-time 15 \
            https://preprod.agshopro.com/api/health

      - name: Notify on failure
        if: failure()
        run: echo "::error::Preprod deploy failed for release ${{ steps.release.outputs.id }}"


# ─────────────────────────────────────────────────────────────────────────────
# FILE 2: .github/workflows/deploy-prod.yml
# Triggers when you push/merge into `main`.
# Requires manual approval via GitHub Environments before deploying.
# Auto-rolls back if healthcheck fails.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy-prod:
    name: Deploy → agshopro.com
    runs-on: ubuntu-latest
    environment: production              # ← requires approval in GitHub settings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate release ID
        id: release
        run: echo "id=$(date +%Y%m%d_%H%M%S)_${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Copy code to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/tmp/agshopro-release"
          rm: true

      - name: Run deploy script on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            bash /var/www/agshopro/scripts/deploy.sh ${{ steps.release.outputs.id }}

      - name: Healthcheck production
        run: |
          echo "Waiting for process to come up..."
          sleep 10
          curl --fail --retry 5 --retry-delay 5 --max-time 15 \
            https://agshopro.com/api/health

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Healthcheck failed — initiating rollback..."
            bash /var/www/agshopro/scripts/rollback.sh

      - name: Notify on failure
        if: failure()
        run: echo "::error::Prod deploy FAILED and was rolled back. Release: ${{ steps.release.outputs.id }}"
