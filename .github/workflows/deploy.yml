name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync release to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          RELEASE_ID="$(date +%Y%m%d%H%M%S)"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          ssh "$EC2_USER@$EC2_HOST" "mkdir -p '$EC2_DEPLOY_PATH/releases/$RELEASE_ID'"
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            ./ "$EC2_USER@$EC2_HOST:$EC2_DEPLOY_PATH/releases/$RELEASE_ID/"

      - name: Run remote deployment script
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" "bash '$EC2_DEPLOY_PATH/releases/$RELEASE_ID/scripts/deploy-ec2.sh' '$EC2_DEPLOY_PATH' '$RELEASE_ID'"

      - name: Healthcheck
        if: ${{ secrets.API_HEALTHCHECK_URL != '' }}
        run: |
          curl --fail --retry 5 --retry-delay 5 "${{ secrets.API_HEALTHCHECK_URL }}"
