name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_api: ${{ steps.check.outputs.has_api }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f "api/package.json" ]; then
            echo "has_api=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_api=false" >> "$GITHUB_OUTPUT"
          fi

  api-ci:
    needs: detect
    if: needs.detect.outputs.has_api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # The integration suite drives the real app against a real database:
    # workspace isolation lives in the SQL, so a stubbed pool would not test it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '5432'
      TEST_DB_USER: postgres
      TEST_DB_PASS: postgres
      TEST_DB_NAME: agshop_test
      TEST_DB_SSL: '0'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Migrations apply to a fresh database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: agshop_migrate_check
          DB_SSL: '0'
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE agshop_migrate_check;"
          npm run migrate:latest
          # Re-running must be a no-op: every migration is tracked and skipped.
          npm run migrate:latest
      - name: Integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build --if-present

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static frontend folder
        run: |
          if [ ! -d "public" ]; then
            echo "public directory not present yet; skipping static checks."
            exit 0
          fi
          echo "public directory found."
