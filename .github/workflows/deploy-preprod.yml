name: Deploy to Preprod

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [staging]

concurrency:
  group: preprod-deploy
  cancel-in-progress: true

jobs:
  deploy-preprod:
    name: Deploy -> preprod.agshopro.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate release ID
        id: release
        run: echo "id=$(date +%Y%m%d_%H%M%S)_${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Copy code to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/tmp/agshopro-release-preprod"
          rm: true

      - name: Run deploy script on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # See deploy-prod.yml: the script comes from the release, not the host.
          script: |
            bash /tmp/agshopro-release-preprod/infra/scripts/deploy.sh preprod ${{ steps.release.outputs.id }}

      # Same two assertions as prod (see deploy-prod.yml for why a bare 200 on
      # /api/health proves nothing). Preprod is the environment prod is supposed
      # to mirror, so the checks must be identical or drift reappears here first.
      - name: Healthcheck preprod
        run: |
          echo "Waiting for process to come up..."
          sleep 8

          echo "--- API is this codebase ---"
          body=$(curl -sS --fail --retry 5 --retry-delay 5 --max-time 15 \
                   https://preprod.agshopro.com/api/health)
          echo "$body"
          case "$body" in
            *'"checks"'*) echo "ok: health payload is from src/routes/health.js" ;;
            *) echo "::error::Preprod /api/health lacks \"checks\" - a DIFFERENT application is serving :3001"; exit 1 ;;
          esac

          echo "--- Frontend is this release ---"
          served=$(curl -sS --fail --max-time 15 "https://preprod.agshopro.com/login.html?deploycheck=${GITHUB_SHA}" | md5sum | cut -d' ' -f1)
          expected=$(md5sum public/login.html | cut -d' ' -f1)
          echo "served=$served expected=$expected"
          if [ "$served" != "$expected" ]; then
            echo "::error::Preprod is serving a different login.html than this commit - check the nginx root points at /var/www/agshopro-preprod/current/public"
            exit 1
          fi
          echo "ok: preprod serves this release"

      - name: Notify on failure
        if: failure()
        run: echo "::error::Preprod deploy failed for release ${{ steps.release.outputs.id }}"
