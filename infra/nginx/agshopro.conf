# AG Shop Pro production Nginx template.
# This file is versioned in Git as the source template for production.
# The preprod vhost is generated by server-setup.sh on the server.

limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=15r/s;

server {
    listen 443 ssl http2;
    server_name agshopro.com www.agshopro.com;

    root /var/www/agshopro/current/public;
    index login.html index.html;

    ssl_certificate /etc/letsencrypt/live/agshopro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agshopro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # The frontend is unbundled, unversioned static HTML/JS: filenames never
    # change between releases, so a browser has no way to tell a new deploy from
    # the file it already holds. Without an explicit directive it falls back to
    # heuristic caching (~10% of the age since Last-Modified) -- a page stamped
    # months ago earns a cache lifetime of weeks, which is exactly how a correct
    # deploy came to look like "nothing changed".
    #
    # no-cache does not mean "do not cache": the response is still stored, but
    # revalidated every time, so an unchanged file costs a 304 rather than a
    # re-download.
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    location ~ /\.env {
        deny all;
        return 404;
    }

    location ~ /\.git {
        deny all;
        return 404;
    }

    location ~ /node_modules {
        deny all;
        return 404;
    }

    location /api/ {
        limit_req zone=api_rate_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name agshopro.com www.agshopro.com;
    return 301 https://$host$request_uri;
}